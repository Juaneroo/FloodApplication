<!DOCTYPE html SYSTEM "http://www.thymeleaf.org/dtd/xhtml1-strict-thymeleaf-spring4-4.dtd">

<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">

    <title>Login SAT</title>
    <meta content="" name="description">
    <meta content="" name="keywords">

    <link th:href="@{/assets/img/favicon.png}" rel="icon">
    <link th:href="@{/assets/img/apple-touch-icon.png}" rel="apple-touch-icon">

    <link href="https://fonts.gstatic.com" rel="preconnect">
    <link href="https://fonts.googleapis.com/css?family=Open+Sans:30F0,300i,400,400i,600,600i,700,700i|Nunito:300,300i,400,400i,600,600i,700,700i|Poppins:300,300i,400,400i,500,500i,600,600i,700,700i"
          rel="stylesheet">

    <link th:href="@{/assets/vendor/bootstrap/css/bootstrap.min.css}" rel="stylesheet">
    <link th:href="@{/assets/vendor/bootstrap-icons/bootstrap-icons.css}" rel="stylesheet">
    <link th:href="@{/assets/vendor/boxicons/css/boxicons.min.css}" rel="stylesheet">
    <link th:href="@{/assets/vendor/quill/quill.snow.css}" rel="stylesheet">
    <link th:href="@{/assets/vendor/quill/quill.bubble.css}" rel="stylesheet">
    <link th:href="@{/assets/vendor/remixicon/remixicon.css}" rel="stylesheet">
    <link th:href="@{/assets/vendor/simple-datatables/style.css}" rel="stylesheet">

    <link th:href="@{/assets/css/style.css}" rel="stylesheet">

</head>

<body>

<main>
    <div class="container">
        <section class="section register min-vh-100 d-flex flex-column align-items-center justify-content-center py-4">
            <div class="container">
                <div class="row justify-content-center">
                    <div class="col-lg-4 col-md-6 d-flex flex-column align-items-center justify-content-center">

                        <div class="row">
                            <div class="card">
                                <div class="card-body">
                                    <div class="pt-4 pb-2">
                                        <h5 class="card-title text-center pb-0 fs-4">Login SAT</h5>
                                        <p class="text-center small">Ingrese sus credenciales de acceso</p>
                                    </div>

                                    <div th:if="${param.roleChanged}" class="alert alert-info">
                                        Su sesión ha sido cerrada porque su rol ha sido modificado. Por favor, vuelva a iniciar sesión para adquirir los nuevos permisos.
                                    </div>

                                    <form th:action="@{/outside/login}" method="post"
                                          class="row g-3">
                                        <div class="col-md-12">
                                            <div class="form-floating">
                                                <input type="text" class="form-control" name="username"
                                                       id="username" maxlength="159" required
                                                       placeholder="Nombre de la familia">
                                                <label for="username">Usuario</label>
                                            </div>
                                        </div>
                                        <div class="col-md-12">
                                            <div class="form-floating">
                                                <input type="password" class="form-control" name="password"
                                                       id="password" maxlength="159" required
                                                       placeholder="Nombre de la familia">
                                                <label for="password">Contraseña</label>
                                            </div>
                                        </div>
                                        <div class="text-center">
                                            <button type="submit" class="btn btn-primary">Acceder</button>
                                            <button type="reset" class="btn btn-secondary">Limpiar</button>
                                        </div>
                                    </form>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </div>
</main><script type="text/javascript" th:src="@{/assets/vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>
<script type="text/javascript" th:src="@{/assets/vendor/chart.js/chart.umd.js}"></script>
<script type="text/javascript" th:src="@{/assets/vendor/echarts/echarts.min.js}"></script>
<script type="text/javascript" th:src="@{/assets/vendor/quill/quill.js}"></script>
<script type="text/javascript" th:src="@{/assets/vendor/simple-datatables/simple-datatables.js}"></script>
<script type="text/javascript" th:src="@{/assets/vendor/tinymce/tinymce.min.js}"></script>
<script type="text/javascript" th:src="@{/assets/vendor/php-email-form/validate.js}"></script>
<script th:src="@{/assets/vendor/apexcharts/apexcharts.min.js}" type="text/javascript"></script>

<script type="text/javascript" th:src="@{/assets/js/main.js}"></script>

</body>

</html>
