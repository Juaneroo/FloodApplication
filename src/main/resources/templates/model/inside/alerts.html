<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Alertas en Tiempo Real</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4 bg-light">
<div class="container">
  <h2 class="mb-4">📢 Últimas Alertas</h2>
  <div id="alertsContainer" class="mt-3"></div>
</div>

<script>
    function cargarAlertas() {
        fetch('/api/alerts/listar')
            .then(response => response.json())
            .then(data => {
                let alertsHTML = '';
                data.forEach(alert => {
                    alertsHTML += `
                        <div class="alert alert-warning alert-dismissible fade show" role="alert">
                            <strong>${alert.mensaje}</strong><br>
                            <small class="text-muted">${new Date(alert.fecha).toLocaleString()}</small>
                            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
                        </div>
                    `;
                });
                document.getElementById("alertsContainer").innerHTML = alertsHTML;
            })
            .catch(error => console.error('Error cargando alertas:', error));
    }

    setInterval(cargarAlertas, 5000); // Recarga cada 5 segundos
    cargarAlertas(); // Cargar al entrar
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
