<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Alertas</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">
<div class="container">
  <h2>Últimas Alertas</h2>
  <div id="alertsContainer" class="mt-3"></div>
</div>

<script>
        function cargarAlertas() {
            fetch('/api/alerts/listar')
                .then(response => response.json())
                .then(data => {
                    let alertsHTML = '';
                    data.forEach(alert => {
                        alertsHTML += `
                            <div class="alert alert-warning alert-dismissible fade show" role="alert">
                                <strong>${alert.mensaje}</strong> <br>
                                <small>${new Date(alert.fecha).toLocaleString()}</small>
                                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                            </div>
                        `;
                    });
                    document.getElementById("alertsContainer").innerHTML = alertsHTML;
                })
                .catch(error => console.error('Error cargando alertas:', error));
        }

        // Cargar alertas cada 5 segundos
        setInterval(cargarAlertas, 5000);
        cargarAlertas();
    </script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
