<!DOCTYPE html SYSTEM "http://www.thymeleaf.org/dtd/xhtml1-strict-thymeleaf-spring4-4.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Personas en estado de alerta - Sensor SAT</title>
    <meta content="" name="description">
    <meta content="" name="keywords">

    <!-- Favicons -->
    <link th:href="@{/assets/img/favicon.png}" rel="icon">
    <link th:href="@{/assets/img/apple-touch-icon.png}" rel="apple-touch-icon">

    <!-- Google Fonts -->
    <link href="https://fonts.gstatic.com" rel="preconnect">
    <link href="https://fonts.googleapis.com/css?family=Open+Sans:300,300i,400,400i,600,600i,700,700i|Nunito:300,300i,400,400i,600,600i,700,700i|Poppins:300,300i,400,400i,500,500i,600,600i,700,700i"
          rel="stylesheet">

    <!-- Vendor CSS Files -->
    <link th:href="@{/assets/vendor/bootstrap/css/bootstrap.min.css}" rel="stylesheet">
    <link th:href="@{/assets/vendor/bootstrap-icons/bootstrap-icons.css}" rel="stylesheet">
    <link th:href="@{/assets/vendor/boxicons/css/boxicons.min.css}" rel="stylesheet">
    <link th:href="@{/assets/vendor/quill/quill.snow.css}" rel="stylesheet">
    <link th:href="@{/assets/vendor/quill/quill.bubble.css}" rel="stylesheet">
    <link th:href="@{/assets/vendor/remixicon/remixicon.css}" rel="stylesheet">
    <link th:href="@{/assets/vendor/simple-datatables/style.css}" rel="stylesheet">

    <!-- Template Main CSS File -->
    <link th:href="@{/assets/css/style.css}" rel="stylesheet">
</head>

<body>

<!-- Header -->
<div th:insert="~{common/html/common-head-info :: common-head-info}"></div>

<!-- Sidebar -->
<div th:insert="~{common/html/common-menu :: common-menu}"></div>

<main id="main" class="main">

    <div class="pagetitle">
        <h1>Personas en estado de alerta</h1>
        <nav>
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="index.html">Inicio</a></li>
                <li class="breadcrumb-item active">Persons</li>
            </ol>
        </nav>
    </div><!-- End Page Title -->

    <section class="section">
        <div class="row">

            <div class="col-lg-12">
                <div class="card">
                    <div class="card-body">

                        <h5 class="card-title">Listado de personas</h5>

                        <!-- Mensaje de error -->
                        <div th:if="${errorMessage}" class="alert alert-danger" role="alert" th:text="${errorMessage}"></div>

                        <form class="row g-3" method="get">
                            <div class="col-md-6">
                                <div class="form-floating">
                                    <input type="date" class="form-control" id="floatingDesde" name="desde" required>
                                    <label for="floatingDesde">Desde</label>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-floating">
                                    <input type="date" class="form-control" id="floatingHasta" name="hasta" required>
                                    <label for="floatingHasta">Hasta</label>
                                </div>
                            </div>
                            <div class="d-flex justify-content-center gap-2 mt-3">
                                <button type="submit" class="btn btn-primary">Filtrar</button>
                                <button type="button" class="btn btn-primary" onclick="generatePDF()">PDF</button>
                            </div>
                        </form>


                        <!-- Tabla de resultados -->
                        <table class="table datatable mt-4" id="pdf-content">
                            <thead>
                            <tr>
                                <th>Persona notificada</th>
                                <th>Teléfono</th>
                                <th>Nivel de riesgo</th>
                                <th>Zona</th>
                                <th>Fecha</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:if="${#lists.isEmpty(personRiskLogs)}">
                                <td colspan="5">No hay alertas en el rango de fechas seleccionado.</td>
                            </tr>
                            <tr th:each="personRiskLog : ${personRiskLogs}">
                                <td><span th:text="${personRiskLog.personName}">Nombre</span></td>
                                <td><span th:text="${personRiskLog.phoneNumber}">Teléfono</span></td>
                                <td>
                                    <span th:text="${personRiskLog.riskLevel}">
                                        Riesgo
                                    </span>
                                    <!-- Icono de riesgo basado en el nivel using th:if -->
                                    <span th:if="${personRiskLog.riskLevel == 'Desastre inminente' ||
                                    personRiskLog.riskLevel == 'Riesgo extremo'  || personRiskLog.riskLevel == 'Peligro inminente'}">
                                        <button type="button" class="btn btn-danger"><i class="bi bi-exclamation-octagon"></i></button>
                                    </span>
                                    <span th:if="${personRiskLog.riskLevel == 'Riesgo muy alto' ||
                                    personRiskLog.riskLevel == 'Riesgo alto'}">
                                        <button type="button" class="btn btn-warning"><i class="bi bi-exclamation-triangle"></i></button>
                                    </span>
                                    <span th:if="${personRiskLog.riskLevel == 'Riesgo considerable'}">
                                        <button type="button" class="btn btn-info"><i class="bi bi-info-circle"></i></button>
                                    </span>
                                </td>
                                <td><span th:text="${personRiskLog.zoneName}">Zona</span></td>
                                <td><span th:text="${personRiskLog.dateFormatted}">Fecha</span></td>

                            </tr>
                            </tbody>
                        </table>

                    </div>
                </div>
            </div>

        </div>
    </section>

</main>

<!-- Footer -->
<footer id="footer" class="footer">
    <div class="copyright">
        &copy; Copyright <strong><span>SensorSAT</span></strong>. Todos los derechos reservados.
    </div>
    <div class="credits">
        Diseñado por <a href="https://bootstrapmade.com/">BootstrapMade</a>
    </div>
</footer>

<a href="#" class="back-to-top d-flex align-items-center justify-content-center">
    <i class="bi bi-arrow-up-short"></i>
</a>

<!-- JS Files -->
<script th:src="@{/assets/vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>
<script th:src="@{/assets/vendor/chart.js/chart.umd.js}"></script>
<script th:src="@{/assets/vendor/echarts/echarts.min.js}"></script>
<script th:src="@{/assets/vendor/quill/quill.js}"></script>
<script th:src="@{/assets/vendor/simple-datatables/simple-datatables.js}"></script>
<script th:src="@{/assets/vendor/tinymce/tinymce.min.js}"></script>
<script th:src="@{/assets/vendor/php-email-form/validate.js}"></script>
<script th:src="@{/assets/js/main.js}"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script>
  function generatePDF() {
    const element = document.getElementById('pdf-content');
    html2pdf()
      .from(element)
      .set({
        margin: 10,
        filename: 'download.pdf',
        image: { type: 'jpeg', quality: 0.98 },
        html2canvas: { scale: 2 },
        jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
      })
      .save();
  }
</script>

</body>
</html>
