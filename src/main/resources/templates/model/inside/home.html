<main id="main" class="main">

    <div class="pagetitle">
        <h1>Profile</h1>
        <nav>
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="index.html">Home</a></li>
                <li class="breadcrumb-item">Users</li>
                <li class="breadcrumb-item active">Profile</li>
            </ol>
        </nav>
    </div><!-- End Page Title -->

    <section class="section profile">
        <div class="row">
            <div class="col-xl-8">

                <div class="card">
                    <div class="card-body pt-3">
                        <!-- Bordered Tabs -->
                        <ul class="nav nav-tabs nav-tabs-bordered">

                            <li class="nav-item">
                                <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#profile-overview">Overview</button>
                            </li>

                        </ul>
                        <div class="tab-content pt-2">

                            <div class="tab-pane fade show active profile-overview" id="profile-overview">
                                <h1>Bienvenido</h1>
                                <h5 class="card-title">Detalles del perfil</h5>

                                <div class="row">
                                    <div class="col-lg-3 col-md-4 label ">Nombre completo</div>
                                    <div class="col-lg-9 col-md-8" th:text="${#authentication.principal.name}">name</div>
                                </div>

                                <div class="row">
                                    <div class="col-lg-3 col-md-4 label">Cedula y/ó usuario</div>
                                    <div class="col-lg-9 col-md-8" th:text="${#authentication.principal.cedula}">cedula</div>
                                </div>

                                <div class="row">
                                    <div class="col-lg-3 col-md-4 label">Rol</div>
                                    <div class="col-lg-9 col-md-8" th:text="${#authentication.principal.roleName}">role</div>
                                </div>

                                <div class="row">
                                    <div class="col-lg-3 col-md-4 label">Telefono</div>
                                    <div class="col-lg-9 col-md-8" th:text="${#authentication.principal.phone}">phone</div>
                                </div>

                            </div>


                        </div><!-- End Bordered Tabs -->

                    </div>
                </div>

            </div>
        </div>
    </section>
